<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<title>Florr Calculator Ju78 - Florr.io Crafting Calculator</title>
	<meta name="description" content="Florr Calculator Ju78 - Free Florr.io crafting calculator for calculating crafting results and probabilities.">
	<meta name="robots" content="index,follow">
	<link rel="canonical" href="https://rjwr8dsykb-creator.github.io/Florr-Calculator-Ju78/">
	<link rel="icon" type="image/png" href="logo.png">

	<link rel="stylesheet" href="Florr.css">

	<script type="application/ld+json">
	{
		"@context":"https://schema.org",
		"@type":"WebSite",
		"name":"Florr Calculator Ju78",
		"url":"https://rjwr8dsykb-creator.github.io/Florr-Calculator-Ju78/"
	}
	</script>
</head>

<body>

	<h1 class="seo-hidden">Florr Calculator Ju78</h1>

	<p class="seo-hidden">
		Florr Calculator Ju78 is a free crafting calculator for Florr.io.
		Calculate crafting results and probabilities for different petal rarities.
	</p>

	<div class="page-wrapper">
		<div class="page-scale">
			<div class="page">

				<div class="rectangle rectangle-left">

					<h2>CHOOSE A RARITY</h2>

					<div class="rarity-grid">

						<div class="rarity rarity-common" data-rarity="64">
							<span>COMMON</span>
						</div>

						<div class="rarity rarity-unusual" data-rarity="32">
							<span>UNUSUAL</span>
						</div>

						<div class="rarity rarity-rare" data-rarity="16">
							<span>RARE</span>
						</div>

						<div class="rarity rarity-epic" data-rarity="8">
							<span>EPIC</span>
						</div>

						<div class="rarity rarity-legendary" data-rarity="4">
							<span>LEGENDARY</span>
						</div>

						<div class="rarity rarity-mythic" data-rarity="2">
							<span>MYTHIC</span>
						</div>

						<div class="rarity rarity-ultra" data-rarity="1">
							<span>ULTRA</span>
						</div>

						<div class="rarity rarity-super" data-rarity="0.1">
							<span>SUPER</span>
						</div>

					</div>

				</div>

				<div class="rectangle rectangle-right">

					<div class="settings">

						<div class="setting-row">

							<label for="petalCount">
								NUMBER OF PETALS YOU ARE CRAFTING
							</label>

							<input
								type="number"
								id="petalCount"
								min="5"
								max="10000000"
								value="5"
							>

						</div>

						<div id="chartContainer" class="chart-container hidden">

							<div id="pieChart" class="pie-chart">

								<div id="pieLabels" class="pie-labels"></div>

								<div class="chart-center">
									<span>CRAFT</span>
								</div>

							</div>

							<div id="chartLegend" class="chart-legend"></div>

							<div class="desired-success-container">

								<label for="desiredSuccess">
									CHECK CHANCE OF GETTING AT LEAST
								</label>

								<div class="desired-success-row">

									<input
										type="number"
										id="desiredSuccess"
										min="1"
										step="1"
										placeholder="Successes"
									>

									<span>SUCCESS</span>

								</div>

								<p
									id="desiredSuccessResult"
									class="desired-success-result"
								></p>

							</div>

							<div id="rarityResult" class="rarity-result"></div>

						</div>

						<div id="results">
							<p>Choose a rarity to begin.</p>
						</div>

					</div>

				</div>

			</div>
		</div>
	</div>

	<script src="Florr.js"></script>

</body>
</html>
