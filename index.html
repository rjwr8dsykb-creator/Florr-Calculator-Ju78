<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Florr Calculator</title>

    <meta
        name="description"
        content="Florr Calculator - Calculate crafting results and probabilities for Florr.io."
    >

    <link
        rel="canonical"
        href="https://rjwr8dsykb-creator.github.io/Florr-Calculator-Ju78/"
    >

    <link rel="icon" type="image/png" href="logo.png">

    <link rel="stylesheet" href="Florr.css">

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Florr Calculator",
        "url": "https://rjwr8dsykb-creator.github.io/Florr-Calculator-Ju78/"
    }
    </script>

</head>

<body>

    <div class="rectangle rectangle-left">

        <h2>CHOOSE A RARITY</h2>

        <div class="rarity-grid">

            <div class="rarity rarity-common" data-rarity="64">
                <span>COMMON</span>
            </div>

            <div class="rarity rarity-unusual" data-rarity="32">
                <span>UNUSUAL</span>
            </div>

            <div class="rarity rarity-rare" data-rarity="16">
                <span>RARE</span>
            </div>

            <div class="rarity rarity-epic" data-rarity="8">
                <span>EPIC</span>
            </div>

            <div class="rarity rarity-legendary" data-rarity="4">
                <span>LEGENDARY</span>
            </div>

            <div class="rarity rarity-mythic" data-rarity="2">
                <span>MYTHIC</span>
            </div>

            <div class="rarity rarity-ultra" data-rarity="1">
                <span>ULTRA</span>
            </div>

        </div>

    </div>


    <div class="rectangle rectangle-right-top">

        <div class="settings">

            <div class="setting-row">

                <label for="petalCount">
                    NUMBER OF PETALS YOU ARE CRAFTING
                </label>

                <input
                    type="number"
                    id="petalCount"
                    min="5"
                    max="10000000"
                    value="5"
                >

            </div>


            <div class="setting-row">

                <label for="simulationCount">
                    NUMBER OF SIMULATIONS
                </label>

                <input
                    type="number"
                    id="simulationCount"
                    min="1000"
                    max="100000"
                    value="50000"
                >

            </div>


            <p class="note">
                Note: More simulations increase accuracy but may slow down the system.
            </p>

        </div>

    </div>


    <div class="rectangle rectangle-right-bottom">

        <h2>RESULT OF YOUR CRAFT</h2>

        <div id="results">
            <p>Choose a rarity to begin.</p>
        </div>

    </div>


    <script src="Florr.js"></script>

</body>

</html>
